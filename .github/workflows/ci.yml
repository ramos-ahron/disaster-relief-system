# Build and test on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drms_test
          POSTGRES_USER: drms
          POSTGRES_PASSWORD: drms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drms -d drms_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/drms_test
      TEST_DB_USER: drms
      TEST_DB_PASSWORD: drms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The database tests use the postgres service above and wipe it first.
      - run: mvn -B verify
