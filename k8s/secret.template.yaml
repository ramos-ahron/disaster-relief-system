# Template only. Do not put real values in this file and do not commit a filled copy.
# Create the secret once per cluster, for example:
#   kubectl -n <K8S_NAMESPACE> create secret generic db-credentials \
#     --from-literal=username=<DB_USER> --from-literal=password=<DB_PASSWORD>
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app: disaster-relief-api
type: Opaque
stringData:
  username: "<DB_USER>"
  password: "<DB_PASSWORD>"
